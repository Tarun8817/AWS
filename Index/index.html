<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud, AWS & DevOps Learning Hub — Study Dashboard</title>
<style>
  :root {
    --bg: #f8fafc;
    --sidebar-bg: #0f172a;
    --sidebar-hover: #1e293b;
    --sidebar-active: #2563eb;
    --card: #ffffff;
    --card-hover: #f1f5f9;
    --card-border: #e2e8f0;
    --card-border-hover: #cbd5e1;
    --ink: #0f172a;
    --ink-muted: #64748b;
    --brand: #2563eb;
    --brand-soft: #eff6ff;
    --brand-border: #bfdbfe;
    --brand-hover: #1d4ed8;
    --accent: #f59e0b;
    --accent-soft: #fffbeb;
    --ok: #10b981;
    --ok-soft: #ecfdf5;
    --pill-bg: #f1f5f9;
    --header-bg: rgba(255, 255, 255, 0.9);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  }

  [data-theme="dark"] {
    --bg: #090d16;
    --sidebar-bg: #0c1220;
    --sidebar-hover: #172033;
    --sidebar-active: #3b82f6;
    --card: #111827;
    --card-hover: #172033;
    --card-border: #1f293d;
    --card-border-hover: #334155;
    --ink: #f8fafc;
    --ink-muted: #94a3b8;
    --brand: #3b82f6;
    --brand-soft: #1e293b;
    --brand-border: #2563eb;
    --brand-hover: #60a5fa;
    --accent: #fbbf24;
    --accent-soft: #2b1f0c;
    --ok: #34d399;
    --ok-soft: #064e3b;
    --pill-bg: #1e293b;
    --header-bg: rgba(17, 24, 39, 0.9);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    transition: background-color .2s ease, color .2s ease;
  }

  /* ================= SIDEBAR ================= */
  #sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    color: #e2e8f0;
    flex-shrink: 0;
    height: 100vh;
    position: sticky;
    top: 0;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 50;
    transition: transform .25s ease;
  }
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1e293b;
    text-decoration: none;
    color: #fff;
  }
  .brand-logo .icon {
    font-size: 1.4rem;
    background: #1e293b;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
  }
  .brand-logo .title { font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
  .brand-logo .sub { font-size: 0.72rem; color: #94a3b8; }

  .sidebar-nav {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .sidebar-nav::-webkit-scrollbar { display: none; }

  .nav-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    margin: 12px 8px 4px;
    font-weight: 700;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 11px;
    border-radius: 8px;
    color: #cbd5e1;
    text-decoration: none;
    font-size: 0.86rem;
    font-weight: 500;
    transition: all .15s;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }
  .nav-item:hover {
    background: var(--sidebar-hover);
    color: #ffffff;
  }
  .nav-item.active {
    background: var(--sidebar-active);
    color: #ffffff;
    font-weight: 600;
  }
  .nav-item.special-note {
    background: rgba(37, 99, 235, 0.15);
    color: #93c5fd;
    border: 1px dashed rgba(59, 130, 246, 0.4);
    margin: 3px 0;
  }
  .nav-item.special-note:hover {
    background: var(--brand);
    color: #fff;
  }
  .nav-item .badge {
    margin-left: auto;
    background: #1e293b;
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 10px;
    color: #94a3b8;
  }
  .nav-item.active .badge {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }

  .sidebar-progress-card {
    background: #172033;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
  }
  .sidebar-progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 6px;
  }
  .sidebar-bar-wrap {
    height: 6px;
    background: #334155;
    border-radius: 99px;
    overflow: hidden;
  }
  .sidebar-bar-fill {
    height: 100%;
    background: var(--ok);
    width: 0%;
    transition: width .3s ease;
  }

  /* ================= MAIN CONTENT ================= */
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* Topbar */
  header.minimal-topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #menu-btn {
    display: none;
    background: none;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--ink);
  }

  /* Search Input */
  .search-box {
    position: relative;
    width: 320px;
    transition: width .2s ease;
  }
  .search-box input {
    width: 100%;
    padding: 7px 30px 7px 34px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    background: var(--pill-bg);
    color: var(--ink);
    font-size: 0.88rem;
    outline: none;
    transition: all .2s;
  }
  .search-box input:focus {
    border-color: var(--brand);
    background: var(--card);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }
  .search-box .icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    color: var(--ink-muted);
    pointer-events: none;
  }
  .search-box .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 0.95rem;
    cursor: pointer;
    display: none;
  }
  .search-box .clear-btn.visible { display: block; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-notes-top {
    background: var(--brand-soft);
    color: var(--brand);
    border: 1px solid var(--brand-border);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all .15s;
  }
  .btn-notes-top:hover {
    background: var(--brand);
    color: #fff;
  }

  .pill-select {
    display: flex;
    background: var(--pill-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 2px;
  }
  .pill-select button {
    background: transparent;
    border: none;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all .15s;
  }
  .pill-select button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  .icon-btn {
    background: var(--pill-bg);
    border: 1px solid var(--card-border);
    color: var(--ink);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all .15s;
  }
  .icon-btn:hover { background: var(--card-hover); }

  /* ================= SUB-HEADER & CONTROLS ================= */
  .content-wrap {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 24px 60px;
    flex: 1;
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .summary-text {
    font-size: 0.86rem;
    color: var(--ink-muted);
  }
  .active-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--brand-soft);
    color: var(--brand);
    padding: 3px 9px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.76rem;
    margin-left: 6px;
    cursor: pointer;
    border: 1px solid var(--brand-border);
    transition: all .15s ease;
  }
  .active-tag:hover {
    background: var(--brand);
    color: #ffffff;
    border-color: var(--brand);
  }
  .sort-select {
    background: var(--pill-bg);
    border: 1px solid var(--card-border);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 10px;
    cursor: pointer;
    outline: none;
  }

  #backtotop {
    position: fixed;
    bottom: 22px;
    right: 22px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    display: none;
    z-index: 60;
    transition: all .2s ease;
  }
  #backtotop:hover {
    background: var(--brand-hover);
    transform: translateY(-2px);
  }

  /* ================= CARDS GRID ================= */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .card:hover {
    border-color: var(--card-border-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .card.completed { border-left: 3px solid var(--ok); }
  .card.bookmarked { border-top: 3px solid var(--accent); }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .card-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .card-icon {
    font-size: 1.35rem;
    width: 34px;
    height: 34px;
    background: var(--brand-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 0.94rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-fav-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--ink-muted);
    padding: 2px 4px;
    transition: transform .15s, color .15s;
    line-height: 1;
  }
  .card-fav-btn:hover { transform: scale(1.2); color: var(--accent); }
  .card-fav-btn.active { color: var(--accent); }

  .card-desc {
    font-size: 0.83rem;
    color: var(--ink-muted);
    line-height: 1.45;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .meta-tag {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--pill-bg);
    color: var(--ink-muted);
    border: 1px solid var(--card-border);
  }
  .meta-tag.lvl-badge {
    background: var(--brand);
    color: #fff;
    border-color: var(--brand);
    font-weight: 700;
  }
  .meta-tag.diff-easy { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .meta-tag.diff-med { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .meta-tag.diff-hard { background: #fef2f2; color: #ef4444; border-color: transparent; }
  .meta-tag.lang-hi { background: #f5f3ff; color: #8b5cf6; border-color: transparent; }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--card-border);
  }
  .check-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-muted);
    cursor: pointer;
    user-select: none;
  }
  .check-label input {
    accent-color: var(--ok);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  .btn-open {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--brand);
    color: #ffffff !important;
    padding: 5px 12px;
    border-radius: 7px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all .15s ease;
  }
  .btn-open:hover {
    background: var(--brand-hover);
    transform: translateX(2px);
  }

  /* Empty state */
  .empty-box {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    background: var(--card);
    border: 1px dashed var(--card-border);
    border-radius: 12px;
    color: var(--ink-muted);
  }

  /* Backdrop */
  #backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 45;
  }
  #backdrop.show { display: block; }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 900px) {
    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
    #menu-btn { display: inline-block; }
    .search-box { width: 100%; order: 3; margin-top: 4px; }
    .content-wrap { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<div id="main" class="flex-1 min-w-0 flex flex-col min-h-screen w-full">

  function setupEvents() {
    const searchInput = document.getElementById("search-input");
    const searchClear = document.getElementById("search-clear");

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      searchClear.classList.toggle("visible", searchQuery.length > 0);
      renderCards();
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
        if (e.key === "Escape") {
          e.target.blur();
          clearSearch();
        }
        return;
      }
      if (e.key === "/" || (e.ctrlKey && e.key === "k")) {
        e.preventDefault();
        searchInput.focus();
      }
    });
  }

  function clearSearch() {
    searchQuery = "";
    const searchInput = document.getElementById("search-input");
    searchInput.value = "";
    document.getElementById("search-clear").classList.remove("visible");
    renderCards();
  }

  // ==========================================
  // 4. RENDERING CARDS & SUMMARY
  // ==========================================
  function renderCards() {
    const container = document.getElementById("cards-grid");
    const showingText = document.getElementById("showing-count");
    const activeHolder = document.getElementById("active-tag-holder");
    container.innerHTML = "";

    // Filter
    let filtered = LEARNING_FILES.filter(file => {
      const matchCat = currentCategory === "all" || file.category === currentCategory;
      const matchLang = currentLanguage === "all" || file.language === currentLanguage;
      
      const isDone = completedModules.includes(file.id);
      const isFav = bookmarkedModules.includes(file.id);

      const matchStatus = currentStatus === "all" || 
        (currentStatus === "completed" && isDone) ||
        (currentStatus === "bookmarked" && isFav);

      const matchQuery = searchQuery === "" || 
        file.title.toLowerCase().includes(searchQuery) ||
        file.description.toLowerCase().includes(searchQuery) ||
        file.category.toLowerCase().includes(searchQuery) ||
        file.tags.some(t => t.toLowerCase().includes(searchQuery)) ||
        `level ${file.level}`.includes(searchQuery);

      return matchCat && matchLang && matchStatus && matchQuery;
    });

    // Sort
    if (currentSort === "roadmap-asc") {
      filtered.sort((a, b) => (a.level || 99) - (b.level || 99));
    } else if (currentSort === "title-asc") {
      filtered.sort((a, b) => a.title.localeCompare(b.title));
    } else if (currentSort === "diff-asc") {
      const order = { "Beginner": 1, "Intermediate": 2, "Advanced": 3 };
      filtered.sort((a, b) => (order[a.difficulty] || 2) - (order[b.difficulty] || 2));
    }

    // Summary text
    showingText.textContent = `Showing ${filtered.length} of ${LEARNING_FILES.length} guides`;
    let tagHtml = "";
    if (currentCategory !== "all") {
      tagHtml += `<span class="active-tag" onclick="filterByNav('all')" title="Click to clear filter">${currentCategory} &times;</span>`;
    }
    if (currentLanguage !== "all") {
      tagHtml += `<span class="active-tag" onclick="resetLanguage()" title="Click to clear language filter">${currentLanguage} &times;</span>`;
    }
    if (currentStatus !== "all") {
      tagHtml += `<span class="active-tag" onclick="filterByNav('all')" title="Click to clear status filter">${currentStatus === 'completed' ? 'Done' : 'Bookmarked'} &times;</span>`;
    }
    if (searchQuery) {
      tagHtml += `<span class="active-tag" onclick="clearSearch()" title="Click to clear search query">"${searchQuery}" &times;</span>`;
    }
    activeHolder.innerHTML = tagHtml;

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-box">
          <div style="font-size:2rem; margin-bottom:8px;">🔍</div>
          <h4 style="font-size:1.05rem; margin-bottom:4px;">No guides match your filter</h4>
          <p style="font-size:0.85rem; margin-bottom:12px;">Try searching for a different keyword or clear filters.</p>
          <button class="btn-open" onclick="resetAllFilters()">Reset Filters</button>
        </div>
      `;
      updateSidebarCounters();
      return;
    }

    filtered.forEach(file => {
      const isDone = completedModules.includes(file.id);
      const isFav = bookmarkedModules.includes(file.id);

      let diffClass = "diff-easy";
      if (file.difficulty === "Intermediate") diffClass = "diff-med";
      if (file.difficulty === "Advanced") diffClass = "diff-hard";

      const card = document.createElement("div");
      card.className = `card ${isDone ? 'completed' : ''} ${isFav ? 'bookmarked' : ''}`;

      card.innerHTML = `
        <div>
          <div class="card-header">
            <div class="card-brand">
              <div class="card-icon">${file.icon || '📄'}</div>
              <h3 class="card-title" title="${file.title}">${file.title}</h3>
            </div>
            <button class="card-fav-btn ${isFav ? 'active' : ''}" title="${isFav ? 'Remove Bookmark' : 'Bookmark'}" onclick="toggleBookmark('${file.id}')">
              ${isFav ? '★' : '☆'}
            </button>
          </div>

          <p class="card-desc">${file.description}</p>

          <div class="card-meta-tags">
            <span class="meta-tag lvl-badge">LVL ${file.level}</span>
            <span class="meta-tag ${diffClass}">${file.difficulty}</span>
            <span class="meta-tag ${file.language === 'Hinglish' ? 'lang-hi' : ''}">${file.language === 'English' ? '🇺🇸 EN' : '🇮🇳 HI'}</span>
            <span class="meta-tag">⏱️ ${file.time}</span>
          </div>
        </div>

        <div class="card-footer">
          <label class="check-label">
            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleDone('${file.id}')">
            <span>${isDone ? 'Completed' : 'Mark Done'}</span>
          </label>
          <a href="${file.filename}" class="btn-open">
            <span>Open Level ${file.level}</span> ➔
          </a>
        </div>
      `;

      container.appendChild(card);
    });

    updateSidebarCounters();
  }

  function updateSidebarCounters() {
    const total = LEARNING_FILES.length;
    const done = completedModules.length;
    const fav = bookmarkedModules.length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    const navAll = document.getElementById("nav-badge-all");
    if (navAll) navAll.textContent = total;
    const navDone = document.getElementById("nav-badge-done");
    if (navDone) navDone.textContent = done;
    const navFav = document.getElementById("nav-badge-fav");
    if (navFav) navFav.textContent = fav;

    const progPct = document.getElementById("sidebar-progress-pct");
    if (progPct) progPct.textContent = `${pct}%`;
    const progBar = document.getElementById("sidebar-progress-bar");
    if (progBar) progBar.style.width = `${pct}%`;

    // Dynamic category counts
    const catCounts = {};
    LEARNING_FILES.forEach(file => {
      catCounts[file.category] = (catCounts[file.category] || 0) + 1;
    });
    ["Security", "Compute", "Networking", "Storage", "Databases", "Containers", "DevOps", "AWS"].forEach(cat => {
      const badge = document.getElementById(`cat-badge-${cat}`);
      if (badge) badge.textContent = catCounts[cat] || 0;
    });
  }

  // ==========================================
  // 5. FILTER HANDLERS
  // ==========================================
  function filterByNav(status) {
    currentStatus = status;
    currentCategory = "all";
    document.querySelectorAll(".sidebar-nav .nav-item").forEach(btn => btn.classList.remove("active"));
    if (status === "all") {
      const navAll = document.getElementById("nav-all");
      if (navAll) navAll.classList.add("active");
    }
    if (status === "completed") {
      const navDone = document.getElementById("nav-completed");
      if (navDone) navDone.classList.add("active");
    }
    if (status === "bookmarked") {
      const navFav = document.getElementById("nav-bookmarks");
      if (navFav) navFav.classList.add("active");
    }
    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (window.innerWidth <= 900) toggleSidebar();
  }

  function filterByCat(cat, btn) {
    if (currentCategory === cat && currentStatus === "all") {
      filterByNav('all');
      return;
    }
    currentCategory = cat;
    currentStatus = "all";
    document.querySelectorAll(".sidebar-nav .nav-item").forEach(b => b.classList.remove("active"));
    if (btn) {
      btn.classList.add("active");
    } else {
      const matchBtn = Array.from(document.querySelectorAll(".sidebar-nav .cat-item")).find(b => b.getAttribute("data-cat") === cat);
      if (matchBtn) matchBtn.classList.add("active");
    }
    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (window.innerWidth <= 900) toggleSidebar();
  }

  function setLanguage(lang, btn) {
    currentLanguage = lang;
    if (btn) {
      btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }
    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetLanguage() {
    currentLanguage = "all";
    document.querySelectorAll("#lang-select button").forEach((b, i) => b.classList.toggle("active", i === 0));
    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setSort(val) {
    currentSort = val;
    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetAllFilters() {
    currentCategory = "all";
    currentLanguage = "all";
    currentStatus = "all";
    currentSort = "roadmap-asc";
    searchQuery = "";
    document.getElementById("search-input").value = "";
    document.getElementById("search-clear").classList.remove("visible");
    document.getElementById("sort-select").value = "roadmap-asc";
    document.querySelectorAll("#lang-select button").forEach((b, i) => b.classList.toggle("active", i === 0));
    filterByNav("all");
  }

  // ==========================================
  // 6. TOGGLES & STORAGE
  // ==========================================
  function toggleDone(id) {
    if (completedModules.includes(id)) {
      completedModules = completedModules.filter(i => i !== id);
    } else {
      completedModules.push(id);
    }
    localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(completedModules));
    renderCards();
  }

  function toggleBookmark(id) {
    if (bookmarkedModules.includes(id)) {
      bookmarkedModules = bookmarkedModules.filter(i => i !== id);
    } else {
      bookmarkedModules.push(id);
    }
    localStorage.setItem(STORAGE_KEY_BOOKMARKS, JSON.stringify(bookmarkedModules));
    renderCards();
  }

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("backdrop").classList.toggle("show");
  }

  // ==========================================
  // 7. THEME TOGGLE & SCROLL
  // ==========================================
  function initTheme() {
    const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || "light";
    document.body.setAttribute("data-theme", savedTheme);
    document.getElementById("theme-btn").textContent = savedTheme === "dark" ? "☀️" : "🌙";
  }

  function toggleTheme() {
    const current = document.body.getAttribute("data-theme");
    const target = current === "dark" ? "light" : "dark";
    document.body.setAttribute("data-theme", target);
    localStorage.setItem(STORAGE_KEY_THEME, target);
    document.getElementById("theme-btn").textContent = target === "dark" ? "☀️" : "🌙";
  }

  // Back to Top button listener
  window.addEventListener("scroll", function(){
    const btt = document.getElementById("backtotop");
    if (btt) btt.style.display = window.scrollY > 300 ? "flex" : "none";
  });
</script>

<button id="backtotop" aria-label="Back to top" onclick="window.scrollTo({top:0, behavior:'smooth'})">&#8679;</button>

</body>
</html>
